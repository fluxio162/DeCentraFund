name: Foundry CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🛠 Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: 📦 Install dependencies (Soldeer)
        run: forge soldeer install

      - name: 🔨 Build contracts
        run: forge build

      - name: ✅ Run tests with logs
        run: forge test -vvv

  frontend:
    runs-on: ubuntu-latest
    needs: contracts

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/de-centra-fund/package-lock.json

      - name: 📥 Install frontend dependencies
        working-directory: frontend/de-centra-fund
        run: npm ci

      - name: 🔧 Build frontend
        working-directory: frontend/de-centra-fund
        run: npm run build

      - name: 🚦 Smoke test frontend start
        working-directory: frontend/de-centra-fund
        run: timeout 10 npm start

